name: GitHub Pages 배포

# 지금 단계의 확인용 배포다. 조회 화면만 있는 M0 는 서버가 할 일이 없어서 정적 파일로 낼 수 있다.
# 최종 목적지는 Vercel 이며(docs/01-DESIGN-LOG.md D5), M2 의 캡처 매칭과 AI 튜터가
# 서버 함수를 요구하는 시점에 그쪽으로 옮긴다. next.config.ts 가 환경변수 하나로 두 경우를 가른다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 콘텐츠 게이트를 먼저 통과해야 배포한다.
      - name: 단위 테스트 (검사기 회귀)
        run: npm test

      - name: 콘텐츠 감사
        run: npm run validate

      # next-env.d.ts 와 .next/types 는 빌드가 만들어 내므로 타입 검사보다 빌드가 먼저다.
      - name: 정적 내보내기
        run: npm run build
        env:
          ARIADNE_BASE_PATH: /ariadne

      - name: 타입 검사
        run: npm run typecheck

      # Pages 는 Jekyll 을 돌리지 않지만, _next 처럼 밑줄로 시작하는 폴더를 위해 안전하게 표시해 둔다.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
