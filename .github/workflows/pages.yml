name: GitHub Pages 배포

# 이 앱의 배포 방식이다. D25 로 GitHub Pages 정적 배포를 한참 유지하기로 정했다.
# 런타임 AI 를 쓰지 않기로 했으므로(D24) 서버가 할 일이 없고, 캡처 매칭도 퀴즈 채점도
# 브라우저 안에서 끝난다. 학습 기록은 기기 안에만 있고 백업 파일로 지킨다.
# next.config.ts 가 환경변수 하나로 정적 내보내기와 서버 빌드를 가르므로,
# 나중에 서버가 필요해지면 그때 옮기면 된다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 콘텐츠 게이트를 먼저 통과해야 배포한다.
      - name: 단위 테스트 (검사기 회귀)
        run: npm test

      - name: 콘텐츠 감사
        run: npm run validate

      # next-env.d.ts 와 .next/types 는 빌드가 만들어 내므로 타입 검사보다 빌드가 먼저다.
      - name: 정적 내보내기
        run: npm run build
        env:
          ARIADNE_BASE_PATH: /ariadne

      - name: 타입 검사
        run: npm run typecheck

      # Pages 는 Jekyll 을 돌리지 않지만, _next 처럼 밑줄로 시작하는 폴더를 위해 안전하게 표시해 둔다.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
